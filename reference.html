<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shadad Split 2.0</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ── Shadad Split 2.0 ──────────────────────────────────────────────
   Single visual world, deliberately: the coach's own deck is a warm
   charcoal gym-floor with a vermilion hairline. Painted explicitly so
   it holds on any host ground; no second theme.                     */
:root{
  --ground:#14100E;
  --ground-2:#0D0A09;
  --panel:#1D1714;
  --panel-2:#241D19;
  --panel-3:#2C2320;
  --line:#432F27;
  --line-hot:rgba(240,85,31,.42);
  --accent:#F0551F;
  --accent-hi:#FF8347;
  --accent-dim:rgba(240,85,31,.13);
  --text:#F4ECE6;
  --text-2:#C3B3A9;
  --muted:#8E7D74;
  --good:#5BC08C;
  --good-dim:rgba(91,192,140,.14);
  --calm:#4E9AA8;
  --calm-dim:rgba(78,154,168,.13);
  --warn:#E0A33C;
  --disp:"Barlow Condensed",'Arial Narrow',sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --chamfer:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);
  --r:4px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground);
  background-image:
    radial-gradient(120% 70% at 78% -8%,rgba(240,85,31,.10),transparent 62%),
    radial-gradient(95% 55% at 8% 104%,rgba(78,154,168,.055),transparent 60%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--body);
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body[dir="rtl"]{--disp:"IBM Plex Sans Arabic",system-ui,sans-serif}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:var(--accent-hi)}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── shell ─────────────────────────────────────────────────────── */
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 132px}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:linear-gradient(var(--ground-2) 72%,rgba(13,10,9,.88));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:720px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:7px;min-width:0}
.brand b{
  font-family:var(--disp);font-style:italic;font-weight:800;
  font-size:22px;letter-spacing:.005em;line-height:1;color:var(--text);
  white-space:nowrap;
}
.brand b i{color:var(--accent);font-style:inherit}
.brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.lang{
  display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  font-size:11px;letter-spacing:.1em;font-weight:600;flex:none;
}
.lang button{padding:5px 11px;color:var(--muted);transition:.15s}
.lang button[aria-pressed="true"]{background:var(--accent);color:#1A0C06}
.tabs{display:flex;gap:4px;max-width:720px;margin:0 auto;padding:0 12px 9px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--muted);white-space:nowrap;border:1px solid transparent;transition:.15s;
}
.tab[aria-selected="true"]{color:var(--text);background:var(--panel-2);border-color:var(--line)}

/* ── panels ────────────────────────────────────────────────────── */
.notch{background:var(--line-hot);padding:1px;clip-path:var(--chamfer)}
.notch>.in{background:var(--panel);clip-path:var(--chamfer);padding:18px}
body[dir="rtl"] .notch,body[dir="rtl"] .notch>.in{
  clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sect{margin-top:26px}
.sect-h{
  display:flex;align-items:center;gap:10px;margin-bottom:11px;
}
.sect-h h2{
  font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--accent);white-space:nowrap;
}
body[dir="rtl"] .sect-h h2{letter-spacing:0;font-size:15px}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600}
body[dir="rtl"] .eyebrow{letter-spacing:0}

/* ── next up hero ──────────────────────────────────────────────── */
.hero{margin-top:18px}
.hero .in{padding:20px 18px 18px}
.hero-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero-day{
  font-family:var(--disp);font-style:italic;font-weight:800;font-size:44px;
  line-height:.92;letter-spacing:.005em;
}
body[dir="rtl"] .hero-day{font-style:normal;font-size:34px;line-height:1.15}
.hero-day em{color:var(--accent);font-style:inherit}
.slotpill{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--accent);background:var(--accent-dim);border:1px solid var(--line-hot);
  padding:4px 9px;border-radius:2px;white-space:nowrap;
}
.hero-sum{color:var(--text-2);font-size:13.5px;margin-top:9px}
.hero-sum b{color:var(--text);font-weight:600}
.cta{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  margin-top:16px;padding:14px;border-radius:3px;
  background:var(--accent);color:#180B05;
  font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.08em;
  text-transform:uppercase;transition:.15s;
}
body[dir="rtl"] .cta{letter-spacing:0;font-size:17px;font-family:var(--body)}
.cta:hover{background:var(--accent-hi)}
.cta.ghost{background:transparent;color:var(--text);border:1px solid var(--line-hot)}
.cta.ghost:hover{background:var(--accent-dim)}
.cta.calm{background:var(--calm);color:#06181C}
.cta.calm:hover{filter:brightness(1.12)}

/* ── coach note ────────────────────────────────────────────────── */
.note{
  border-inline-start:2px solid var(--line-hot);
  background:linear-gradient(90deg,var(--accent-dim),transparent 78%);
  padding:11px 13px;border-radius:0 var(--r) var(--r) 0;
  font-size:13px;line-height:1.6;color:var(--text-2);
}
body[dir="rtl"] .note{
  background:linear-gradient(270deg,var(--accent-dim),transparent 78%);
  border-radius:var(--r) 0 0 var(--r);
}
.note b{color:var(--text);font-weight:600}
.note .who{
  display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:5px;
}
body[dir="rtl"] .note .who{letter-spacing:0;font-size:11px}
.notelist{display:flex;flex-direction:column;gap:9px}
.notelist li{
  display:flex;gap:10px;font-size:13.5px;line-height:1.62;color:var(--text-2);
}
.notelist li::before{
  content:"";flex:none;width:5px;height:5px;margin-top:8px;
  background:var(--accent);transform:rotate(45deg);
}

/* ── split table ───────────────────────────────────────────────── */
.split{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.split-row{
  display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);
  font-size:14px;transition:.15s;
}
.split-row .nm{font-family:var(--disp);font-style:italic;font-weight:700;font-size:19px;letter-spacing:.01em}
body[dir="rtl"] .split-row .nm{font-style:normal;font-size:15px}
.split-row .dy{margin-inline-start:auto;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.split-row .ct{font-size:11.5px;color:var(--muted)}
.split-row.is-rest{background:var(--panel-2)}
.split-row.is-rest .nm{color:var(--calm);font-size:15px;font-style:normal;font-family:var(--body);font-weight:600;letter-spacing:.04em}
.split-row.is-now{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent)}
body[dir="rtl"] .split-row.is-now{box-shadow:inset -3px 0 0 var(--accent)}
.split-row.is-now .dy{color:var(--accent)}

/* ── exercise card ─────────────────────────────────────────────── */
.exlist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex.is-done{border-color:rgba(91,192,140,.3)}
.ex-h{display:flex;align-items:flex-start;gap:11px;padding:13px 14px 11px}
.ex-n{
  font-family:var(--disp);font-style:italic;font-weight:800;font-size:17px;
  color:var(--accent);flex:none;width:22px;line-height:1.35;
}
body[dir="rtl"] .ex-n{font-style:normal;font-family:var(--mono);font-size:13px;width:auto}
.ex-t{flex:1;min-width:0}
.ex-t h3{font-size:15.5px;font-weight:600;line-height:1.3}
.ex.is-done .ex-n{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.02em;
  padding:3px 7px;border-radius:2px;background:var(--panel-3);color:var(--text-2);
  white-space:nowrap;border:1px solid transparent;
}
.chip.i{cursor:help;border-color:var(--line);color:var(--accent-hi)}
.chip.i:hover{background:var(--accent-dim)}
.chip.i::after{content:"ⓘ";margin-inline-start:4px;opacity:.75}
.vid{
  flex:none;display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:2px;
  background:var(--accent-dim);border:1px solid var(--line-hot);color:var(--accent-hi);
  font-size:11px;font-weight:600;text-decoration:none;transition:.15s;
}
.vid:hover{background:var(--accent);color:#180B05;border-color:var(--accent)}
.vid.off{background:var(--panel-3);border-color:var(--line);color:var(--muted);cursor:default}
.vid.on{background:var(--accent);color:#180B05;border-color:var(--accent)}
.vid svg{display:block}

/* ── inline player ─────────────────────────────────────────────── */
.player{margin:0 14px 12px}
.player .fr{
  position:relative;aspect-ratio:16/9;max-width:100%;background:#000;
  border:1px solid var(--line-hot);border-radius:var(--r);overflow:hidden;
}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.player .fb{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:11px;padding:18px;text-align:center;background:var(--panel-2);
}
.player .fb p{font-size:12.5px;line-height:1.55;color:var(--muted)}
.player .cap{
  display:flex;align-items:center;gap:8px;margin-top:7px;
  font-size:11px;color:var(--muted);
}
.player .cap a{color:var(--muted);text-decoration:none;margin-inline-start:auto;
  border-bottom:1px solid var(--line);white-space:nowrap}
.player .cap a:hover{color:var(--accent-hi);border-color:var(--line-hot)}

.rows{padding:0 14px 13px;display:flex;flex-direction:column;gap:7px}
.rowlbl{
  display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:5px;
}
body[dir="rtl"] .rowlbl{letter-spacing:0;font-size:11.5px}
.rowlbl::after{content:"";flex:1;height:1px;background:var(--line)}
.setrow{display:flex;align-items:center;gap:7px}
.setrow .tag{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);
  flex:none;width:34px;text-align:center;
}
.setrow.wu .tag{color:var(--calm);font-size:9.5px;letter-spacing:.02em}
.fld{
  flex:1;min-width:0;display:flex;align-items:center;gap:4px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  padding:0 8px;height:40px;transition:.15s;
}
.fld:focus-within{border-color:var(--accent);background:var(--panel-3)}
.fld input{
  width:100%;min-width:0;background:none;border:0;outline:none;
  font-family:var(--mono);font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:end;padding:0;
}
body[dir="rtl"] .fld input{text-align:start;direction:ltr}
.fld input::placeholder{color:#5C4C45;font-weight:500}
.fld u{
  font-size:10px;text-decoration:none;color:var(--muted);flex:none;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600;
}
.xmark{flex:none;color:var(--muted);font-size:12px;font-family:var(--mono)}
.tick{
  flex:none;width:40px;height:40px;border-radius:3px;
  border:1px solid var(--line);background:var(--panel-2);
  display:grid;place-items:center;color:var(--muted);transition:.15s;
}
.tick:hover{border-color:var(--accent);color:var(--accent)}
.tick[aria-pressed="true"]{background:var(--good-dim);border-color:rgba(91,192,140,.45);color:var(--good)}
.last{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  padding-inline-start:41px;margin-top:-2px;display:flex;align-items:center;gap:6px;
}
.last b{color:var(--text-2);font-weight:600}
.last .up{color:var(--good)}

/* ── cardio / rest ─────────────────────────────────────────────── */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv>div{background:var(--panel-2);padding:10px 12px}
.kv dt{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
body[dir="rtl"] .kv dt{letter-spacing:0;font-size:11px}
.kv dd{margin:3px 0 0;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text)}
.disc{
  width:100%;display:flex;align-items:center;gap:8px;padding:11px 13px;
  font-size:12.5px;font-weight:600;color:var(--text-2);text-align:start;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);transition:.15s;
}
.disc:hover{color:var(--text);border-color:var(--line-hot)}
.disc .cv{margin-inline-start:auto;color:var(--accent);transition:transform .2s;font-size:11px}
.disc[aria-expanded="true"] .cv{transform:rotate(180deg)}
.discbody{padding:13px 4px 2px}

/* ── stats ─────────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats>div{background:var(--panel-2);padding:12px 10px;text-align:center}
.stats .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stats .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
body[dir="rtl"] .stats .k{letter-spacing:0;font-size:11px}

/* ── history ───────────────────────────────────────────────────── */
.hist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.hrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-align:start;transition:.15s}
.hrow:hover{border-color:var(--line-hot)}
.hrow .d{font-family:var(--disp);font-style:italic;font-weight:700;font-size:18px;flex:none}
body[dir="rtl"] .hrow .d{font-style:normal;font-size:15px;font-family:var(--body);font-weight:600}
.hrow .m{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.hrow .dt{font-size:11.5px;color:var(--text-2);white-space:nowrap}
.hdet{padding:2px 14px 13px;font-family:var(--mono);font-size:11.5px;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.hdet i{color:var(--muted);font-style:normal}

/* ── bottom bar + timer ────────────────────────────────────────── */
.dock{
  position:fixed;inset-inline:0;bottom:0;z-index:50;
  background:linear-gradient(rgba(13,10,9,.6),var(--ground-2) 34%);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(10px);
}
.dock-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog .t{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:5px}
.prog .t b{color:var(--text)}
.bar{height:4px;background:var(--panel-3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.dock .cta{width:auto;margin:0;padding:12px 20px;font-size:16px;flex:none}
.timer{
  position:fixed;inset-inline:0;bottom:0;z-index:60;
  padding:0 16px calc(env(safe-area-inset-bottom,0px));
}
.timer-in{
  max-width:720px;margin:0 auto 4px;display:flex;align-items:center;gap:12px;
  background:var(--panel-3);border:1px solid var(--line-hot);border-radius:var(--r);
  padding:9px 12px;
}
.timer .cd{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer .lb{flex:1;min-width:0;font-size:11.5px;color:var(--text-2)}
.timer .lb b{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
body[dir="rtl"] .timer .lb b{letter-spacing:0;font-size:11px}
.timer button{font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:3px}
.timer button:hover{color:var(--text);border-color:var(--line-hot)}
.timer.done .cd{color:var(--good)}

/* ── modal ─────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(8,5,4,.74);display:grid;place-items:end center;padding:16px;backdrop-filter:blur(3px)}
@media(min-width:560px){.scrim{place-items:center}}
.modal{
  width:100%;max-width:480px;max-height:84vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line-hot);border-radius:var(--r);
  padding:20px;
}
.modal h3{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
body[dir="rtl"] .modal h3{letter-spacing:0;font-size:17px}
.modal p{font-size:13.5px;line-height:1.62;color:var(--text-2)}
.modal .x{margin-top:16px;width:100%;padding:11px;border:1px solid var(--line);border-radius:3px;font-weight:600;font-size:13px;color:var(--text-2)}
.modal .x:hover{border-color:var(--line-hot);color:var(--text)}

/* ── video card ────────────────────────────────────────────────── */
.vcard{
  display:flex;align-items:center;gap:14px;padding:15px;text-decoration:none;
  background:linear-gradient(120deg,var(--panel-2),var(--panel));
  border:1px solid var(--line-hot);border-radius:var(--r);transition:.15s;color:var(--text);
}
.vcard:hover{background:linear-gradient(120deg,var(--panel-3),var(--panel-2))}
.play{
  flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);
  display:grid;place-items:center;
}
.play::after{content:"";width:0;height:0;border-inline-start:15px solid #180B05;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-inline-start:4px}
body[dir="rtl"] .play::after{border-inline-start:0;border-inline-end:15px solid #180B05;margin-inline:0 4px}
.vcard .m{flex:1;min-width:0}
.vcard .m b{display:block;font-size:14.5px;font-weight:600}
.vcard .m span{font-size:12px;color:var(--muted)}

  const d=dayOf(k);if(!d)return{};
  const o={};
  d.ex.forEach((e,i)=>{
    o[i]={w:Array.from({length:e.wu},()=>({kg:"",r:"",d:false})),
          s:Array.from({length:e.s},()=>({kg:"",r:"",d:false}))};
  });
  return o;
}
function totals(a){
  if(!a)return{done:0,all:0,vol:0};
  const d=dayOf(a.dayKey);let done=0,all=0,vol=0;
  if(d)d.ex.forEach((e,i)=>{
    const en=a.e[i];if(!en)return;
    all+=e.s;
    en.s.forEach(st=>{if(st.d){done++;vol+=num(st.kg)*num(st.r);}});
  });
  return{done,all,vol};
}
/* most recent logged set for an exercise, by name */
function lastFor(name,exceptId){
  for(const s of S.sessions){
    if(exceptId&&s.id===exceptId)continue;
    const hit=(s.ex||[]).find(x=>x.n===name&&(x.s||[]).some(v=>v.d));
    if(hit){
      const sets=hit.s.filter(v=>v.d);
      if(sets.length)return{sets,when:s.finishedAt};
    }
  }
  return null;
}

let wq=Promise.resolve(),aTimer=null;
const col=()=>S.db&&S.uid?S.db.collection("data/users/"+S.uid):null;
function setStatus(s,err){S.status=s;const n=$("#sync");if(n){n.textContent=s;n.className="sync"+(err?" err":"");}}
function dbErr(e){
  const c=e&&e.code;
  if(c==="quota_exceeded"){setStatus(t("quota"),true);return;}
  if(c==="not_granted"||c==="capability_disabled"||c==="revoked"){S.db=null;setStatus(t("savedlocal"));return;}
  setStatus(t("savedlocal"),true);
}
function queue(fn){wq=wq.then(fn).catch(dbErr);return wq;}
function saveState(){
  lsWrite();const c=col();if(!c)return;
  queue(()=>c.doc("state").set({kind:"state",cycleIndex:S.cycleIndex,lang:S.lang,unit:S.unit,at:Date.now()})
    .then(()=>setStatus(t("saved"))));
}
function saveActive(now){
  lsWrite();
  const c=col();if(!c)return;
  clearTimeout(aTimer);
  const go=()=>queue(()=>{
    setStatus(t("saving"));
    return (S.active?c.doc("active").set(Object.assign({kind:"active"},S.active))
                    :c.doc("active").delete()).then(()=>setStatus(t("saved")));
  });
  now?go():aTimer=setTimeout(go,1100);
}

/* The coach's own demos, played through YouTube's embedded player so the
   app never has to hand you off to youtube.com. Nothing is re-hosted. */
function playerBlock(vid,name,pad){
  const url="https://www.youtube.com/watch?v="+vid;
  return '<div class="player"'+(pad?' style="margin:0"':'')+'>'+
    '<div class="fr"><iframe data-check="1" loading="lazy" '+

      '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(t("openyt"))+' ↗</a></div></div>';
}
/* A CSP-blocked frame still fires `load`, but stays same-origin on
   about:blank — a cross-origin throw is the proof it really loaded. */
function checkFrames(){
  document.querySelectorAll('.player iframe[data-check]').forEach(fr=>{
    fr.removeAttribute("data-check");
    let settled=false;
    const verdict=()=>{
      if(settled||!fr.isConnected)return;settled=true;
      let blocked=false;
      try{blocked=fr.contentWindow.location.href==="about:blank";}catch(e){blocked=false;}
      if(!blocked)return;
      const box=fr.parentNode,link=box.parentNode.querySelector(".cap a");
      box.innerHTML='<div class="fb"><p>'+esc(t("blocked"))+'</p>'+
        '<a class="vid" href="'+esc(link?link.getAttribute("href"):"https://www.youtube.com")+
        '" target="_blank" rel="noopener">'+ICON_PLAY+esc(t("openyt"))+'</a></div>';
    };
    fr.addEventListener("load",()=>setTimeout(verdict,200));
    setTimeout(verdict,5000);
  });
}

function renderTimer(){
  const n=$("#overlay"),tm=S.timer;
  if(n.dataset.k==="modal")return;            /* a dialog owns the layer */
  if(!tm){if(n.dataset.k==="timer"){n.innerHTML="";n.dataset.k="";}return;}
  const left=Math.max(0,Math.ceil((tm.endsAt-Date.now())/1000));
  const mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
  n.dataset.k="timer";
  n.innerHTML='<div class="timer'+(left===0?" done":"")+'"><div class="timer-in">'+
    '<span class="cd">'+mm+':'+ss+'</span><span class="lb"><b>'+esc(t("resting"))+'</b>'+esc(tm.name)+'</span>'+
    '<button data-a="skiprest">'+esc(left===0?t("golift"):t("skip"))+'</button></div></div>';
}
function startTimer(name,sec){S.timer={endsAt:Date.now()+sec*1000,name:name};renderTimer();}
setInterval(()=>{if(S.timer){if(Date.now()-S.timer.endsAt>20000){S.timer=null;}renderTimer();}},1000);

/* ── modal ──────────────────────────────────────────────────────── */
function modal(title,body){
  const n=$("#overlay");n.dataset.k="modal";
  n.innerHTML='<div class="scrim" data-a="closemodal"><div class="modal" role="dialog" aria-modal="true">'+
    '<h3>'+esc(title)+'</h3>'+body+'<button class="x" data-a="closemodal">'+esc(t("close"))+'</button></div></div>';
}
function closeModal(){const n=$("#overlay");n.innerHTML="";n.dataset.k="";renderTimer();}

/* ── root render ────────────────────────────────────────────────── */
function render(){
  document.body.setAttribute("dir",S.lang==="ar"?"rtl":"ltr");
  document.documentElement.setAttribute("lang",S.lang);
  const tabs=[["today",t("today")],["guide",t("guide")],["history",t("history")]];
  $("#tabs").innerHTML=tabs.map(([k,l])=>'<button class="tab" data-v="'+k+'" role="tab" aria-selected="'+
    ((S.view===k||(S.view==="workout"&&k==="today"))?"true":"false")+'">'+esc(l)+'</button>').join("");
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang?"true":"false"));
  const v=S.view==="guide"?viewGuide():S.view==="history"?viewHistory():S.view==="workout"?viewWorkout():viewToday();
  $("#app").innerHTML=v;
  renderDock();
  checkFrames();
}

/* ════════════════════════════════════════════════════════════════
   Actions
   ════════════════════════════════════════════════════════════════ */
function startWorkout(){
  const k=slotKey(S.cycleIndex);if(k==="rest")return;
  S.active={slot:slotNo(S.cycleIndex),dayKey:k,startedAt:Date.now(),e:blankEntries(k),cardio:{done:false,min:""}};
  S.view="workout";saveActive(true);render();window.scrollTo(0,0);
}
function finishWorkout(){
  const a=S.active;if(!a)return;
  const d=dayOf(a.dayKey),tt=totals(a);
  const id="s_"+a.startedAt;
  const rec={id:id,kind:"session",dayKey:a.dayKey,slot:a.slot,startedAt:a.startedAt,
    finishedAt:Date.now(),durationMs:Date.now()-a.startedAt,setsDone:tt.done,vol:Math.round(tt.vol),unit:S.unit,
    cardio:a.cardio,
    ex:d.ex.map((e,i)=>({n:e.n,w:(a.e[i]||{w:[]}).w,s:(a.e[i]||{s:[]}).s}))};
  S.sessions.unshift(rec);
  S.cycleIndex++;S.active=null;S.timer=null;S.view="today";
  lsWrite();
  const c=col();
  if(c)queue(()=>c.doc(id).set(rec).then(()=>c.doc("active").delete()).then(()=>setStatus(t("saved"))));
  saveState();
  render();window.scrollTo(0,0);
  const mins=Math.round(rec.durationMs/60000);
  modal(t("wrote"),
    '<div class="stats" style="margin-bottom:14px">'+
    '<div><div class="v">'+rec.setsDone+'</div><div class="k">'+esc(t("sets"))+'</div></div>'+
    '<div><div class="v">'+rec.vol.toLocaleString("en-US")+'</div><div class="k">'+esc(t("volume"))+' '+S.unit+'</div></div>'+
    '<div><div class="v">'+mins+'</div><div class="k">'+esc(t("minutes"))+'</div></div></div>'+
    C.closing[S.lang].map((p,n)=>'<p style="'+(n?"margin-top:9px":"")+'">'+esc(p)+'</p>').join(""));
}
function restDone(){S.cycleIndex++;saveState();render();window.scrollTo(0,0);}

/* ── events ─────────────────────────────────────────────────────── */
document.addEventListener("click",ev=>{
  const T_=ev.target;
  const tab=T_.closest("[data-v]");
  if(tab){S.view=tab.dataset.v;closeModal();render();window.scrollTo(0,0);return;}
  const lg=T_.closest("#lang button");
  if(lg){S.lang=lg.dataset.l;saveState();render();return;}

  const act=T_.closest("[data-a]");
  if(act){
    const a=act.dataset.a;
    if(a==="closemodal"){if(T_.closest(".modal")&&T_.dataset.a!=="closemodal")return;closeModal();return;}
    if(a==="start"){startWorkout();return;}
    if(a==="go"){S.view="workout";render();window.scrollTo(0,0);return;}
    if(a==="finish"){finishWorkout();return;}
    if(a==="restdone"){restDone();return;}
    if(a==="skiprest"){S.timer=null;renderTimer();return;}
  }
  const info=T_.closest("[data-i]");
  if(info){
    const k=info.dataset.i;
    if(k==="novid"){modal(t("novid"),'<p>'+esc(t("novidmsg"))+'</p>');return;}
    const g=C.gloss.items.find(x=>x.k===k);
    if(g)modal(g.t[S.lang],'<p>'+esc(g.d[S.lang])+'</p>');
    return;
  }
  const disc=T_.closest("[data-d]");
  if(disc){S.open[disc.dataset.d]=!S.open[disc.dataset.d];render();return;}
  const hist=T_.closest("[data-h]");
  if(hist){S.open[hist.dataset.h]=!S.open[hist.dataset.h];render();return;}

  const pv=T_.closest("[data-pv]");
  if(pv){S.player=S.player===pv.dataset.pv?null:pv.dataset.pv;render();return;}

  /* Ticking a set updates in place — a full re-render would tear down
     an open player and restart the video mid-set. */
  const tick=T_.closest("button.tick[data-x]");
  if(tick&&S.active){
    const i=+tick.dataset.x,p=tick.dataset.p,j=+tick.dataset.j;
    const st=S.active.e[i][p][j];st.d=!st.d;
    if(st.d){
      const e=dayOf(S.active.dayKey).ex[i];
      if(!st.r){
        st.r=e.reps.split("-")[0];
        const inp=document.getElementById("f-"+p+i+"-"+j+"-r");
        if(inp)inp.value=st.r;
      }
      startTimer(e.n,e.sec);
    }
    tick.setAttribute("aria-pressed",st.d?"true":"false");
    const card=tick.closest(".ex"),en=S.active.e[i];
    if(card)card.classList.toggle("is-done",en.s.length>0&&en.s.every(s=>s.d));
    saveActive();renderDock();
    return;
  }
  const cd=T_.closest("button.tick[data-c]");
  if(cd&&S.active){S.active.cardio.done=!S.active.cardio.done;saveActive();render();}
});
document.addEventListener("input",ev=>{
  const el=ev.target;if(!S.active)return;
  if(el.dataset.c==="min"){S.active.cardio.min=el.value;saveActive();return;}
  if(el.dataset.x===undefined)return;
  const i=+el.dataset.x,p=el.dataset.p,j=+el.dataset.j,f=el.dataset.f;
  if(!S.active.e[i])return;
  S.active.e[i][p][j][f]=el.value;
  saveActive();
  if(S.view==="workout")renderDock();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ════════════════════════════════════════════════════════════════
   Boot — render from local cache immediately, light up db after
   ════════════════════════════════════════════════════════════════ */
(function boot(){
  const c=lsRead();
  if(c){S.lang=c.lang||"en";S.unit=c.unit||"kg";S.cycleIndex=c.cycleIndex||0;
        S.active=c.active||null;S.sessions=c.sessions||[];
        if(S.active)S.view="workout";}
  S.status=T.savedlocal[S.lang];
  render();
})();

(async function link(){
  let db=null,user=null;
  try{db=await window.claude?.use?.("db");}catch(e){}
  try{user=await window.claude?.use?.("user");}catch(e){}
  if(!db||!user)return;
  let uid=null;
  try{uid=await user.id();}catch(e){}
  if(!uid)return;
  S.db=db;S.uid=uid;
  const c=db.collection("data/users/"+uid);
  try{
    const st=await c.doc("state").get();
    if(st.exists){
      const v=st.data();
      if(typeof v.cycleIndex==="number")S.cycleIndex=v.cycleIndex;
      if(v.unit)S.unit=v.unit;
      if(v.lang&&!lsRead())S.lang=v.lang;
    }
    const ac=await c.doc("active").get();
    if(ac.exists){
      const v=ac.data();
      if(!S.active||(v.startedAt||0)>=(S.active.startedAt||0)){
        S.active={slot:v.slot,dayKey:v.dayKey,startedAt:v.startedAt,e:v.e||blankEntries(v.dayKey),
                  cardio:v.cardio||{done:false,min:""}};
        S.view="workout";
      }
    }
    const qs=await c.where("kind","==","session").orderBy("finishedAt","desc").limit(200).get();
    const remote=qs.docs.map(d=>Object.assign({id:d.id},d.data()));
    const seen=new Set(remote.map(r=>r.id));
    S.sessions=remote.concat(S.sessions.filter(s=>!seen.has(s.id)))
                     .sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0));
    setStatus(T.saved[S.lang]);
    lsWrite();render();
  }catch(e){dbErr(e);}
})();
</script>
